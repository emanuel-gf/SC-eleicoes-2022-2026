[project]
name = "tse-eleicao"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastparquet>=2026.5.0",
    "geobr>=1.0.0",
    "geopandas>=1.1.2",
    "geopy>=2.5.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "tqdm>=4.70.0",
]

[project.scripts]
tse-eleicao = "tse_eleicao:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
